{{ define "content" }}
<section class="relative isolate mx-auto w-full max-w-3xl">
  <p class="font-mono text-[11px] uppercase tracking-[0.32em] text-copper">Library Genesis</p>
  <h1 class="mt-3 font-serif italic text-[clamp(2rem,5vw,3.2rem)] leading-[0.95] text-foam">{{ t "download.heading" }}</h1>
  <p class="mt-6 max-w-xl text-lg leading-relaxed text-foam/70">{{ .Message }}</p>
  <p class="mt-8">
    <a href="/" class="inline-flex font-mono text-[11px] uppercase tracking-[0.22em] text-copper hover:text-foam">{{ t "download.back" }}</a>
  </p>
</section>
{{ end }}
