{{ define "content" }}
<section class="settings-panel">
  <p class="font-mono text-[11px] uppercase tracking-[0.32em] text-copper">Library Genesis</p>
  <h1 class="page-title">{{ if .Heading }}{{ .Heading }}{{ else }}{{ t "download.heading" }}{{ end }}</h1>
  <p class="mt-6 max-w-xl text-lg leading-relaxed text-foam/70">{{ .Message }}</p>
  {{ if .AdsURL }}
  <p class="mt-8">
    <a href="{{ .AdsURL }}" target="_blank" rel="noopener noreferrer" data-amarra-skip class="download-link">{{ t "download.try_ads" }}</a>
  </p>
  {{ end }}
  <p class="mt-8">
    <a href="/" class="download-link">{{ t "download.back" }}</a>
  </p>
</section>
{{ end }}
